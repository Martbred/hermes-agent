[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-homelab-ops"
version = "0.1.0"
description = "Security-focused homelab operations extension for Hermes Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
hermes-homelab-ops = "homelab_ops.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["homelab_ops*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
